<!DOCTYPE html>
<html lang="ja">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Profile</title>
        <link rel="stylesheet" href="style.css">
    </head>
</head>
<body>
    <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <div class="glass-container">
    <header>
      <button id="theme-toggle" class="glass-btn">🌙 ダークモード</button>
    </header>

    <div class="profile">
      <img src="kari_icon.jpg" alt="プロフィールアイコン" class="icon">
        <h1>
          渡辺 翔太<br>
          <span style="font-size: 1rem; opacity: 0.8; font-weight: normal;">Syota Watanabe</span>
        </h1>
      <p>情報系の大学でWeb開発やAWSを勉強中です！</p>
      <p>チーム開発や，スマホアプリの開発をしました。</p>
      <p>休日はスト6をしたり，NBAを見ています。</p>
    </div>

      <hr style="border: none; border-top: 1px solid var(--glass-border); margin: 30px 0;">
      
      <div class="contact-section">
        <h3>Contact Me</h3>
        <form id="contact-form" class="contact-form">
          <input type="text" id="sender-name" placeholder="お名前" required>
          <textarea id="sender-message" placeholder="メッセージ" rows="3" required></textarea>
          <button type="submit" class="glass-btn">送信する</button>
        </form>
        <!-- APIからの返事を表示する場所 -->
        <p id="response-message" style="margin-top: 10px; font-size: 0.9rem;"></p>
      </div>

    <ul class="links">
      <li><a href="https://github.com/watchsyota-design/profile_site" class="glass-btn">GitHub</a></li>
      <li><a href="#" class="glass-btn">何かしら</a></li>
      <li><a href="#" class="glass-btn">X (Twitter)</a></li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
